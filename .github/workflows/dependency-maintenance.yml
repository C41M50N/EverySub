name: Dependency maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'
      timezone: America/Detroit

# Each job asks for what it needs. The update job runs freshly updated
# dependency code (install, taze, tests, build) with read-only access; only the
# pull-request job can push, and it runs none of that code.
permissions: {}

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.save.outputs.base }}
      changed: ${{ steps.save.outputs.changed }}
      planned: ${{ steps.audit.outputs.planned }}
      applied: ${{ steps.audit.outputs.applied }}
      remaining: ${{ steps.audit.outputs.remaining }}
      blocked: ${{ steps.audit.outputs.blocked }}
      unfixable: ${{ steps.audit.outputs.unfixable }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/setup

      - name: Update dependencies within declared ranges
        run: >-
          bunx taze@21.1.0 -w
          --maturity-period 7
          --no-github-actions

      - name: Regenerate the lockfile
        run: bun install --ignore-scripts

      - name: Plan and apply available security fixes
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          set +e
          plan_json="$(bun audit fix --dry-run --json)"
          plan_status=$?
          set -e

          if ! jq -e '
            type == "object" and
            (.fixes | type == "array") and
            (.fixed | type == "number") and
            (.remaining | type == "number") and
            (.blocked | type == "array") and
            (.unfixable | type == "array")
          ' >/dev/null <<<"$plan_json"; then
            echo "::error::Bun Audit dry run returned invalid JSON (exit $plan_status)."
            exit 1
          fi

          planned="$(jq -r '.fixes | length' <<<"$plan_json")"
          applied=0
          result_json="$plan_json"

          if (( planned > 0 )); then
            set +e
            result_json="$(bun audit fix --json --ignore-scripts)"
            apply_status=$?
            set -e

            if ! jq -e '
              type == "object" and
              (.fixed | type == "number") and
              (.remaining | type == "number") and
              (.blocked | type == "array") and
              (.unfixable | type == "array")
            ' >/dev/null <<<"$result_json"; then
              echo "::error::Bun Audit fix returned invalid JSON (exit $apply_status)."
              exit 1
            fi

            applied="$(jq -r '.fixed' <<<"$result_json")"
          fi

          remaining="$(jq -r '.remaining' <<<"$result_json")"
          blocked="$(jq -r '.blocked | length' <<<"$result_json")"
          unfixable="$(jq -r '.unfixable | length' <<<"$result_json")"

          {
            echo "planned=$planned"
            echo "applied=$applied"
            echo "remaining=$remaining"
            echo "blocked=$blocked"
            echo "unfixable=$unfixable"
          } >>"$GITHUB_OUTPUT"

          {
            echo "## Bun Audit"
            echo
            echo "| Result | Count |"
            echo "| --- | ---: |"
            echo "| Fixes planned | $planned |"
            echo "| Fixes applied | $applied |"
            echo "| Vulnerabilities remaining | $remaining |"
            echo "| Blocked fixes | $blocked |"
            echo "| Unfixable advisories | $unfixable |"
          } >>"$GITHUB_STEP_SUMMARY"

          if (( remaining > 0 )); then
            echo "::warning::Bun Audit reports $remaining unresolved vulnerabilities."
          fi

      - name: Reject unexpected changes
        shell: bash
        run: |
          set -euo pipefail

          unexpected_files=()
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              package.json | bun.lock) ;;
              *) unexpected_files+=("$file") ;;
            esac
          done < <(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          if (( ${#unexpected_files[@]} > 0 )); then
            printf '::error::Unexpected file changed: %s\n' "${unexpected_files[@]}"
            exit 1
          fi

      # Fail fast here so a broken update never opens a PR. CI runs these again
      # on the PR branch to satisfy the required check.
      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VARLOCK_ENV: test

      - name: Save the update
        id: save
        run: |
          git diff --binary -- package.json bun.lock >"$RUNNER_TEMP/dependencies.patch"
          echo "base=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [[ -s "$RUNNER_TEMP/dependencies.patch" ]]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the update
        if: steps.save.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-update
          path: ${{ runner.temp }}/dependencies.patch
          retention-days: 1

  pull-request:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # dispatch CI on the dependency branch
      contents: write
      pull-requests: write

    steps:
      # The exact commit the update was made against, so the patch applies
      # even if main moved meanwhile. The PR targets main either way.
      - name: Check out the updated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.base }}
          persist-credentials: false

      - name: Download the update
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-update
          path: ${{ runner.temp }}

      - name: Apply the update
        run: git apply "$RUNNER_TEMP/dependencies.patch"

      - name: Create or update the dependency pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: automation/dependency-maintenance
          delete-branch: true
          reviewers: C41M50N
          add-paths: |
            package.json
            bun.lock
          commit-message: 'chore(deps): update dependencies'
          title: 'chore(deps): update dependencies'
          body: |
            Applies routine dependency updates within the declared version ranges,
            followed by available Bun Audit fixes.

            ### Bun Audit

            | Result | Count |
            | --- | ---: |
            | Fixes planned | ${{ needs.update.outputs.planned }} |
            | Fixes applied | ${{ needs.update.outputs.applied }} |
            | Vulnerabilities remaining | ${{ needs.update.outputs.remaining }} |
            | Blocked fixes | ${{ needs.update.outputs.blocked }} |
            | Unfixable advisories | ${{ needs.update.outputs.unfixable }} |

            Unresolved advisories are reported for review and do not fail this workflow.

            [View the workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so CI wouldn't
      # report on the PR. workflow_dispatch is the documented exception.
      - name: Run CI on the dependency branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --ref automation/dependency-maintenance
        env:
          GH_TOKEN: ${{ github.token }}
