name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Also dispatched by dependency maintenance, whose GITHUB_TOKEN pushes don't trigger `push`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Every branch is checked on push, so a pull request needs no second run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Database tests connect to the URL in .env.test, which this matches.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: everysub
          POSTGRES_PASSWORD: everysub
          POSTGRES_DB: everysub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username everysub --dbname everysub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/setup

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Varlock blocks the build until required config is set. The committed
      # .env.test supplies placeholder values; this build is never deployed.
      - name: Build
        run: bun run build
        env:
          VARLOCK_ENV: test

  browser:
    # Browser tests cost flake and upkeep rather than minutes, so they run as
    # their own job on pull requests and main, keeping `check` fast. See
    # docs/testing.md.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: everysub
          POSTGRES_PASSWORD: everysub
          POSTGRES_DB: everysub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username everysub --dbname everysub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/setup

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # Builds the app and serves the production build on port 3000 itself.
      - name: Browser tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
